apiVersion: x.within.website/v1
kind: App
metadata:
  name: iamd

spec:
  image: ghcr.io/xe/x/iamd:latest
  autoUpdate: true
  logLevel: debug

  env:
    # Enable after provisioning the upstream client and mounting its secret file.
    # See docs/iamd-oidc.md for callbacks and the complete configuration.
    - name: OIDC_ENABLED
      value: "false"
    - name: OIDC_ISSUER
      value: "https://iamd.xeserv.us"
    # - name: BOOTSTRAP_USERNAME
    #   value: "Xe Iaso"
    - name: REGION
      value: yow
    - name: SIGNING_KEY_CACHE_TTL
      value: 15m

  ingress:
    enabled: true
    host: iamd.xeserv.us

  storage:
    enabled: true
    path: /data
    size: 4Gi
    storageClass: itsuki
